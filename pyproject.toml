[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remarkable-paper-pro-manager"
version = "0.2.0"
description = "Desktop GUI for deploying reMarkable Paper Pro custom templates and sleep screens."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "paramiko>=3.5",
    "Pillow>=10.4",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[project.scripts]
rmpp-manager = "rmpp_manager.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
