name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build macOS application
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --osx-bundle-identifier "com.chrissyhroberts.remarkable-customiser" \
            --name "reMarkable Paper Pro Manager" \
            packaging/launcher.py

          PLIST="dist/reMarkable Paper Pro Manager.app/Contents/Info.plist"

          if /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.2.1" "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 0.2.1" "$PLIST"
          fi

          if /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 0.2.1" "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 0.2.1" "$PLIST"
          fi

      - name: Ad-hoc sign application
        run: |
          codesign --force --deep --sign - "dist/reMarkable Paper Pro Manager.app"
          codesign --verify --deep --strict "dist/reMarkable Paper Pro Manager.app"

      - name: Package macOS application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/reMarkable Paper Pro Manager.app" \
            "remarkable-paper-pro-manager-macos-arm64.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: remarkable-paper-pro-manager-macos-arm64
          path: remarkable-paper-pro-manager-macos-arm64.zip
          if-no-files-found: error

  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --version-file "packaging/version_info.txt" `
            --name "reMarkable Paper Pro Manager" `
            packaging/launcher.py

      - name: Package Windows application
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/reMarkable Paper Pro Manager.exe" `
            -DestinationPath "remarkable-paper-pro-manager-windows-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: remarkable-paper-pro-manager-windows-x64
          path: remarkable-paper-pro-manager-windows-x64.zip
          if-no-files-found: error

  publish-release:
  name: Publish tagged release
  if: startsWith(github.ref, 'refs/tags/')
  needs:
    - build-macos
    - build-windows
  runs-on: ubuntu-latest

  permissions:
    contents: write

  steps:
    - name: Check out repository
      uses: actions/checkout@v5

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: remarkable-paper-pro-manager-*
        path: release
        merge-multiple: true

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          release/remarkable-paper-pro-manager-macos-arm64.zip \
          release/remarkable-paper-pro-manager-windows-x64.zip \
          --title "reMarkable Paper Pro Manager $GITHUB_REF_NAME" \
          --generate-notes